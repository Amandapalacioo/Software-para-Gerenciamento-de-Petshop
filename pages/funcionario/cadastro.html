<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Funcionário - Petshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">Petshop</a>
      <a class="nav-link text-white" href="../../index.html">Início</a>
      <a class="nav-link text-white" href="../cliente/cadastro.html">Clientes</a>
      <a class="nav-link text-white" href="../funcionario/cadastro.html">Funcionários</a>
      <a class="nav-link text-white" href="../animal/cadastro.html">Animais</a>
      <a class="nav-link text-white" href="../atendimento/cadastro.html">Atendimentos</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Cadastrar Funcionário</h1>

    <p>
      <a href="cadastro.html">Cadastro</a>
      <a href="consulta.html">Consulta</a>
      <a href="alteracao.html">Alteração</a>
      <a href="remocao.html">Remoção</a>
      <a href="relatorio.html">Relatório</a>
    </p>

    <form onsubmit="return validarFuncionario()">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
      </div>
      <div class="mb-3">
        <label for="matricula" class="form-label">Matrícula</label>
        <input type="text" class="form-control" id="matricula" name="matricula" required>
      </div>
      <div class="mb-3">
        <label for="qualificacao" class="form-label">Qualificação</label>
        <input type="text" class="form-control" id="qualificacao" name="qualificacao" required>
      </div>
      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição da função</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label for="carga" class="form-label">Carga horária semanal (h)</label>
        <input type="number" class="form-control" id="carga" name="carga" required>
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
      <a href="../../index.html" class="btn btn-secondary">Voltar</a>
    </form>
  </div>

  <footer class="text-center mt-5">
    <p>Programação de Sistemas Web - Software para Gerenciamento de Petshop</p>
  </footer>

  <script>
    function validarFuncionario() {
      var carga = document.getElementById("carga").value;

      if (carga < 1 || carga > 44) {
        alert("A carga horária semanal deve ser de 1 a 44 horas!");
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
