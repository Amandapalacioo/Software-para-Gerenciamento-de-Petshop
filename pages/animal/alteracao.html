<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alterar Animal - Petshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">Petshop</a>
      <a class="nav-link text-white" href="../../index.html">Início</a>
      <a class="nav-link text-white" href="../cliente/cadastro.html">Clientes</a>
      <a class="nav-link text-white" href="../funcionario/cadastro.html">Funcionários</a>
      <a class="nav-link text-white" href="../animal/cadastro.html">Animais</a>
      <a class="nav-link text-white" href="../atendimento/cadastro.html">Atendimentos</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Alterar Animal</h1>

     <p>
      <a href="cadastro.html">Cadastro</a>
      <a href="consulta.html">Consulta</a>
      <a href="alteracao.html">Alteração</a>
      <a href="remocao.html">Remoção</a>
      <a href="relatorio.html">Relatório</a>
    </p>

    <form>
      <div class="mb-3">
        <label for="busca" class="form-label">Nome do animal</label>
        <input type="text" class="form-control" id="busca" name="busca">
      </div>
      <button type="submit" class="btn btn-secondary">Buscar</button>
    </form>

    <hr>

    <form>
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
      </div>
      <div class="mb-3">
        <label for="peso" class="form-label">Peso (kg)</label>
        <input type="number" class="form-control" id="peso" name="peso" step="0.01" required>
      </div>
      <div class="mb-3">
        <label for="altura" class="form-label">Altura (cm)</label>
        <input type="number" class="form-control" id="altura" name="altura" required>
      </div>
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a href="../../index.html" class="btn btn-secondary">Voltar</a>
    </form>
  </div>

  <footer class="text-center mt-5">
    <p>Programação de Sistemas Web - Software para Gerenciamento de Petshop</p>
  </footer>

</body>
</html>
