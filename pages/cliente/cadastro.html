<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar Cliente - Petshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">Petshop</a>
      <a class="nav-link text-white" href="../../index.html">Início</a>
      <a class="nav-link text-white" href="../cliente/cadastro.html">Clientes</a>
      <a class="nav-link text-white" href="../funcionario/cadastro.html">Funcionários</a>
      <a class="nav-link text-white" href="../animal/cadastro.html">Animais</a>
      <a class="nav-link text-white" href="../atendimento/cadastro.html">Atendimentos</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Cadastrar Cliente</h1>

    <p>
      <a href="cadastro.html">Cadastro</a>
      <a href="consulta.html">Consulta</a>
      <a href="alteracao.html">Alteração</a>
      <a href="remocao.html">Remoção</a>
      <a href="relatorio.html">Relatório</a>
    </p>

    <form onsubmit="return validarCliente()">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
      </div>
      <div class="mb-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="telefone" name="telefone" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="rg" class="form-label">RG</label>
        <input type="text" class="form-control" id="rg" name="rg" required>
      </div>
      <div class="mb-3">
        <label for="cpf" class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" name="cpf" required>
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
      <a href="../../index.html" class="btn btn-secondary">Voltar</a>
    </form>
  </div>

  <footer class="text-center mt-5">
    <p>Programação de Sistemas Web - Software para Gerenciamento de Petshop</p>
  </footer>

  <script>
    function validarCliente() {
      var cpf = document.getElementById("cpf").value;

      if (cpf.length != 11) {
        alert("O CPF deve ter 11 números (sem pontos e traço)!");
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
